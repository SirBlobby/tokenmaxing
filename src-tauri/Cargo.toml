[package]
name = "tokenmaxing"
version = "0.1.0"
description = "Claude Code usage widget"
authors = ["you"]
edition = "2021"

[lib]
name = "tokenmaxing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
sha1 = "0.10"
hex = "0.4"
tempfile = "3"
ureq = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
